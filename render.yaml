services:
  - type: web
    name: connecthub-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://connect-hub-frontend-1.onrender.com,http://localhost:5173,http://localhost:4173
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
